[package]
name = "companion-core"
description = "What Horizon on the Switch would otherwise do itself, done on a computer: the SD card's game files, builds, mods and saves."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
horizon-mods = { path = "../../vendor/horizon-mods", features = ["index"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
fs2 = "0.4"
flate2 = "1"

[dev-dependencies]
