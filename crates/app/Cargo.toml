[package]
name = "horizon-nx-companion"
description = "Horizon for Switch companion: prepares the SD card on a computer."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "horizon-nx-companion"
path = "src/main.rs"

[dependencies]
companion-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.18"
horizon-mod-package = { path = "../../vendor/horizon/crates/horizon-mod-package", features = ["index"] }
horizon-core = { path = "../../vendor/horizon/crates/horizon-core" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
