name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of this version (0.1.0); empty: just build"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE: ${{ inputs.release }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: packaging/macos/bundle.sh "$(.github/version.sh)"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-nx-companion-macos
          path: dist/horizon-nx-companion-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p horizon-nx-companion
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/horizon-nx-companion.exe "dist/Horizon NX Companion.exe"
          Compress-Archive -Path "dist/Horizon NX Companion.exe" -DestinationPath dist/horizon-nx-companion-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-nx-companion-windows
          path: dist/horizon-nx-companion-windows.zip

  linux:
    # The oldest supported runner: the binary then runs on older distributions too (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p horizon-nx-companion
      - name: Pack
        run: |
          dir=dist/horizon-nx-companion
          mkdir -p "$dir"
          cp target/release/horizon-nx-companion packaging/linux/* "$dir/"
          tar -C dist -czf dist/horizon-nx-companion-linux-x86_64.tar.gz horizon-nx-companion
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-nx-companion-linux
          path: dist/horizon-nx-companion-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [test, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          [ -n "$RELEASE" ] && tag="v$RELEASE"
          notes=source/packaging/release-notes.md
          gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Horizon NX Companion $tag" --notes-file "$notes"
